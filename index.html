<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self' https://pfqecgcsmswholidmadi.supabase.co wss://pfqecgcsmswholidmadi.supabase.co; object-src 'none'; base-uri 'self'; form-action 'self'">

<title>Konténer Forecast</title>
<link rel="icon" href="icon.ico">
<link rel="stylesheet" href="styles.css?v=20261020090058">
</head>
<body>
<div class="boot" id="boot" aria-hidden="true">
  <div class="boot-stage">
    <div class="boot-hoist"><i class="boot-cable"></i><i class="boot-spreader"></i></div>
    <svg class="boot-ct" viewBox="0 0 400 96" preserveAspectRatio="xMidYMid meet">
      <defs><clipPath id="boot-clip"><rect x="2" y="6" width="396" height="84" rx="2"/></clipPath></defs>
      <rect class="bt-body" x="2" y="6" width="396" height="84" rx="2"/>
      <g clip-path="url(#boot-clip)"><rect class="bt-fill" x="2" y="6" width="396" height="84"/><rect class="bt-sheen" x="-120" y="6" width="90" height="84"/></g>
      <g class="bt-ribs"><line x1="22" y1="13" x2="22" y2="83" style="--i:0"/><line x1="36" y1="13" x2="36" y2="83" style="--i:1"/><line x1="50" y1="13" x2="50" y2="83" style="--i:2"/><line x1="64" y1="13" x2="64" y2="83" style="--i:3"/><line x1="78" y1="13" x2="78" y2="83" style="--i:4"/><line x1="92" y1="13" x2="92" y2="83" style="--i:5"/><line x1="106" y1="13" x2="106" y2="83" style="--i:6"/><line x1="120" y1="13" x2="120" y2="83" style="--i:7"/><line x1="134" y1="13" x2="134" y2="83" style="--i:8"/><line x1="148" y1="13" x2="148" y2="83" style="--i:9"/><line x1="162" y1="13" x2="162" y2="83" style="--i:10"/><line x1="176" y1="13" x2="176" y2="83" style="--i:11"/><line x1="190" y1="13" x2="190" y2="83" style="--i:12"/><line x1="204" y1="13" x2="204" y2="83" style="--i:13"/><line x1="218" y1="13" x2="218" y2="83" style="--i:14"/><line x1="232" y1="13" x2="232" y2="83" style="--i:15"/><line x1="246" y1="13" x2="246" y2="83" style="--i:16"/><line x1="260" y1="13" x2="260" y2="83" style="--i:17"/><line x1="274" y1="13" x2="274" y2="83" style="--i:18"/><line x1="288" y1="13" x2="288" y2="83" style="--i:19"/><line x1="302" y1="13" x2="302" y2="83" style="--i:20"/><line x1="316" y1="13" x2="316" y2="83" style="--i:21"/><line x1="330" y1="13" x2="330" y2="83" style="--i:22"/><line x1="344" y1="13" x2="344" y2="83" style="--i:23"/><line x1="358" y1="13" x2="358" y2="83" style="--i:24"/><line x1="372" y1="13" x2="372" y2="83" style="--i:25"/></g>
      <g class="bt-frame"><rect x="2" y="6" width="396" height="6"/><rect x="2" y="83" width="396" height="7"/><rect x="2" y="6" width="8" height="84"/><rect x="390" y="6" width="8" height="84"/></g>
      <g class="bt-cast"><rect x="2" y="6" width="14" height="11" rx="1"/><rect x="384" y="6" width="14" height="11" rx="1"/><rect x="2" y="79" width="14" height="11" rx="1"/><rect x="384" y="79" width="14" height="11" rx="1"/></g>
      <rect class="bt-outline" x="2" y="6" width="396" height="84" rx="2" pathLength="1"/>
    </svg>
    <div class="boot-name"><span style="--i:0">K</span><span style="--i:1">o</span><span style="--i:2">n</span><span style="--i:3">t</span><span style="--i:4">é</span><span style="--i:5">n</span><span style="--i:6">e</span><span style="--i:7">r</span><i></i><span style="--i:9">F</span><span style="--i:10">o</span><span style="--i:11">r</span><span style="--i:12">e</span><span style="--i:13">c</span><span style="--i:14">a</span><span style="--i:15">s</span><span style="--i:16">t</span></div>
  </div>
  <div class="boot-rail"></div>
</div>

<div class="app" id="app" hidden>
  <header class="top">
    <div class="brand" style="--i:0">
      <svg width="28" height="20" viewBox="0 0 28 20" fill="none" aria-hidden="true"><rect x="1" y="2" width="26" height="16" rx="1.5" stroke="currentColor" stroke-width="1.6"/><path d="M6 5v10M10 5v10M14 5v10M18 5v10M22 5v10" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/></svg>
      <span>Konténer Forecast</span>
    </div>
    <nav class="tabs" aria-label="Nézet" style="--i:1">
      <button type="button" class="tab" data-action="view" data-view="week"><i class="tab-bg" aria-hidden="true"></i>Hét</button>
      <button type="button" class="tab" data-action="view" data-view="month"><i class="tab-bg" aria-hidden="true"></i>Naptár</button>
      <button type="button" class="tab" data-action="view" data-view="stats"><i class="tab-bg" aria-hidden="true"></i>Statisztika</button>
    </nav>
    <div class="search" style="--i:2">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="M20 20l-4.2-4.2"/></svg>
      <input id="q" type="search" autocomplete="off" spellcheck="false" placeholder="Konténer, MRN, rendszám, PDD" aria-label="Keresés">
      <div class="qres" id="qres" hidden></div>
    </div>
    <div class="spacer"></div>
    <div class="period" id="period" style="--i:3"></div>
    <div class="sync" id="sync" style="--i:4"></div>
  </header>
  <div id="view"></div>
</div>
<div id="drawer"></div>
<div id="tip" class="tip" role="tooltip" hidden></div>

<section class="auth" id="auth" hidden aria-live="polite">
  <div class="auth-card">
    <div class="auth-brand">
      <svg width="34" height="24" viewBox="0 0 28 20" fill="none" aria-hidden="true"><rect x="1" y="2" width="26" height="16" rx="1.5" stroke="currentColor" stroke-width="1.6"/><path d="M6 5v10M10 5v10M14 5v10M18 5v10M22 5v10" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/></svg>
      <span>Konténer Forecast</span>
    </div>

    <div id="invite" class="auth-form" hidden>
      <h1>Meghívó szükséges</h1>
      <p class="auth-text" id="invite-text">Ezt az oldalt személyes meghívó linkkel lehet megnyitni. Kérj linket az admintól.</p>
    </div>

    <div id="denied" class="auth-form" hidden>
      <h1>Nincs hozzáférés</h1>
      <p class="auth-text" id="denied-text"></p>
    </div>
  </div>
</section>

<dialog id="settings" class="settings" aria-labelledby="settings-title">
  <div class="settings-inner">
    <div class="settings-head">
      <h2 id="settings-title">Beállítások</h2>
      <button type="button" class="x-btn" data-action="settings-close" aria-label="Bezárás"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
    </div>

    <section class="set-sec" style="--i:0">
      <h3>Fiók</h3>
      <div class="me" id="me"></div>
    </section>

    <section class="set-sec" id="users-sec" style="--i:1" hidden>
      <h3>Kollégák</h3>
      <ul class="users" id="users"></ul>
      <form id="user-form" class="user-form">
        <label class="sr" for="user-name">Név</label>
        <input id="user-name" type="text" placeholder="Kolléga neve" autocomplete="off" maxlength="80" required>
        <button type="submit" class="btn-primary sm">Meghívó link</button>
      </form>
      <div class="newpw" id="newpw" hidden></div>
    </section>

    <section class="set-sec" id="outlook-sec" style="--i:2" hidden>
      <h3>Outlook-szinkron</h3>
      <form id="outlook-form" class="stack-form">
        <label>Feladó e-mail címe
          <input name="sender" type="email" autocomplete="off" spellcheck="false" required>
        </label>
        <label>Tárgy tartalmazza
          <input name="subject_hint" type="text" autocomplete="off" spellcheck="false">
        </label>
        <label>Frissítés (perc)
          <input name="interval_min" type="number" min="2" max="240" step="1" required>
        </label>
        <label class="check"><input name="autostart" type="checkbox">Indítás a Windows-zal</label>
        <div class="settings-row">
          <button type="submit" class="btn-primary sm">Mentés</button>
          <button type="button" class="btn-ghost sm" data-action="resync">Teljes újraolvasás</button>
          <button type="button" class="btn-ghost sm" data-action="datafolder">Adatmappa</button>
        </div>
      </form>
    </section>
  </div>
</dialog>

<dialog id="paste" class="settings" aria-labelledby="paste-title">
  <div class="settings-inner">
    <div class="settings-head">
      <h2 id="paste-title">ETA beillesztése</h2>
      <button type="button" class="x-btn" data-action="paste-close" aria-label="Bezárás"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
    </div>
    <label class="sr" for="paste-text">ETA szöveg</label>
    <textarea id="paste-text" class="paste-text" rows="9" spellcheck="false" placeholder="TCLU8361862//&#10;J1zTM202609280377&#10;ETA 11:30"></textarea>
    <div class="paste-list" id="paste-list"></div>
    <div class="settings-actions">
      <button type="button" class="btn-ghost sm" data-action="paste-close">Mégse</button>
      <button type="button" class="btn-primary sm" data-action="paste-save" id="paste-save" disabled>Rögzítés</button>
    </div>
  </div>
</dialog>

<script src="vendor/supabase.min.js?v=20261020090058"></script>
<script src="config.js?v=20261020090058"></script>
<script src="derive.js?v=20261020090058"></script>
<script src="app.js?v=20261020090058"></script>
</body>
</html>
