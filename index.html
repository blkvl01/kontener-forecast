<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self' https://pfqecgcsmswholidmadi.supabase.co wss://pfqecgcsmswholidmadi.supabase.co; object-src 'none'; base-uri 'self'; form-action 'self'">
<meta name="referrer" content="no-referrer">
<title>Konténer Forecast</title>
<link rel="icon" href="icon.ico">
<link rel="stylesheet" href="styles.css?v=20261019205441">
</head>
<body>
<div class="app" id="app" hidden>
  <header class="top">
    <div class="brand">
      <svg width="28" height="20" viewBox="0 0 28 20" fill="none" aria-hidden="true"><rect x="1" y="2" width="26" height="16" rx="1.5" stroke="currentColor" stroke-width="1.6"/><path d="M6 5v10M10 5v10M14 5v10M18 5v10M22 5v10" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/></svg>
      <span>Konténer Forecast</span>
    </div>
    <nav class="tabs" aria-label="Nézet">
      <button type="button" class="tab" data-action="view" data-view="week">Hét</button>
      <button type="button" class="tab" data-action="view" data-view="month">Naptár</button>
      <button type="button" class="tab" data-action="view" data-view="stats">Statisztika</button>
    </nav>
    <div class="search">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="M20 20l-4.2-4.2"/></svg>
      <input id="q" type="search" autocomplete="off" spellcheck="false" placeholder="Konténer, MRN, rendszám, PDD" aria-label="Keresés">
      <div class="qres" id="qres" hidden></div>
    </div>
    <div class="spacer"></div>
    <div class="period" id="period"></div>
    <div class="sync" id="sync"></div>
  </header>
  <div id="view"></div>
</div>
<div id="drawer"></div>
<div id="tip" class="tip" role="tooltip" hidden></div>

<section class="auth" id="auth" hidden aria-live="polite">
  <div class="auth-card">
    <div class="auth-brand">
      <svg width="34" height="24" viewBox="0 0 28 20" fill="none" aria-hidden="true"><rect x="1" y="2" width="26" height="16" rx="1.5" stroke="currentColor" stroke-width="1.6"/><path d="M6 5v10M10 5v10M14 5v10M18 5v10M22 5v10" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/></svg>
      <span>Konténer Forecast</span>
    </div>

    <div id="invite" class="auth-form" hidden>
      <h1>Meghívó szükséges</h1>
      <p class="auth-text" id="invite-text">Ezt az oldalt személyes meghívó linkkel lehet megnyitni. Kérj linket az admintól.</p>
    </div>

    <div id="denied" class="auth-form" hidden>
      <h1>Nincs hozzáférés</h1>
      <p class="auth-text" id="denied-text"></p>
    </div>

    <div id="auth-loading" class="auth-loading" hidden><span class="sync-dot busy"></span></div>
  </div>
</section>

<dialog id="settings" class="settings" aria-labelledby="settings-title">
  <div class="settings-inner">
    <div class="settings-head">
      <h2 id="settings-title">Beállítások</h2>
      <button type="button" class="x-btn" data-action="settings-close" aria-label="Bezárás"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
    </div>

    <section class="set-sec">
      <h3>Fiók</h3>
      <div class="me" id="me"></div>
    </section>

    <section class="set-sec" id="users-sec" hidden>
      <h3>Kollégák</h3>
      <ul class="users" id="users"></ul>
      <form id="user-form" class="user-form">
        <label class="sr" for="user-name">Név</label>
        <input id="user-name" type="text" placeholder="Kolléga neve" autocomplete="off" maxlength="80" required>
        <button type="submit" class="btn-primary sm">Meghívó link</button>
      </form>
      <div class="newpw" id="newpw" hidden></div>
    </section>

    <section class="set-sec" id="outlook-sec" hidden>
      <h3>Outlook-szinkron</h3>
      <form id="outlook-form" class="stack-form">
        <label>Feladó e-mail címe
          <input name="sender" type="email" autocomplete="off" spellcheck="false" required>
        </label>
        <label>Tárgy tartalmazza
          <input name="subject_hint" type="text" autocomplete="off" spellcheck="false">
        </label>
        <label>Frissítés (perc)
          <input name="interval_min" type="number" min="2" max="240" step="1" required>
        </label>
        <label class="check"><input name="autostart" type="checkbox">Indítás a Windows-zal</label>
        <div class="settings-row">
          <button type="submit" class="btn-primary sm">Mentés</button>
          <button type="button" class="btn-ghost sm" data-action="resync">Teljes újraolvasás</button>
          <button type="button" class="btn-ghost sm" data-action="datafolder">Adatmappa</button>
        </div>
      </form>
    </section>
  </div>
</dialog>

<dialog id="paste" class="settings" aria-labelledby="paste-title">
  <div class="settings-inner">
    <div class="settings-head">
      <h2 id="paste-title">ETA beillesztése</h2>
      <button type="button" class="x-btn" data-action="paste-close" aria-label="Bezárás"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
    </div>
    <label class="sr" for="paste-text">ETA szöveg</label>
    <textarea id="paste-text" class="paste-text" rows="9" spellcheck="false" placeholder="TCLU8361862//&#10;J1zTM202609280377&#10;ETA 11:30"></textarea>
    <div class="paste-list" id="paste-list"></div>
    <div class="settings-actions">
      <button type="button" class="btn-ghost sm" data-action="paste-close">Mégse</button>
      <button type="button" class="btn-primary sm" data-action="paste-save" id="paste-save" disabled>Rögzítés</button>
    </div>
  </div>
</dialog>

<script src="vendor/supabase.min.js?v=20261019205441"></script>
<script src="config.js?v=20261019205441"></script>
<script src="derive.js?v=20261019205441"></script>
<script src="app.js?v=20261019205441"></script>
</body>
</html>
