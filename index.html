<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Konténer Forecast</title>
<link rel="icon" href="icon.ico">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="app" id="app" hidden>
  <header class="top">
    <div class="brand">
      <svg width="28" height="20" viewBox="0 0 28 20" fill="none" aria-hidden="true"><rect x="1" y="2" width="26" height="16" rx="1.5" stroke="currentColor" stroke-width="1.6"/><path d="M6 5v10M10 5v10M14 5v10M18 5v10M22 5v10" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/></svg>
      <span>Konténer Forecast</span>
    </div>
    <nav class="tabs" aria-label="Nézet">
      <button type="button" class="tab" data-action="view" data-view="week">Hét</button>
      <button type="button" class="tab" data-action="view" data-view="month">Naptár</button>
    </nav>
    <div class="spacer"></div>
    <div class="period" id="period"></div>
    <div class="sync" id="sync"></div>
  </header>
  <div id="view"></div>
</div>
<div id="drawer"></div>

<section class="auth" id="auth" hidden aria-live="polite">
  <div class="auth-card">
    <div class="auth-brand">
      <svg width="34" height="24" viewBox="0 0 28 20" fill="none" aria-hidden="true"><rect x="1" y="2" width="26" height="16" rx="1.5" stroke="currentColor" stroke-width="1.6"/><path d="M6 5v10M10 5v10M14 5v10M18 5v10M22 5v10" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/></svg>
      <span>Konténer Forecast</span>
    </div>

    <form id="login-form" class="auth-form" hidden>
      <label for="login-email">E-mail</label>
      <input id="login-email" name="email" type="email" autocomplete="username" required>
      <label for="login-password">Jelszó</label>
      <input id="login-password" name="password" type="password" autocomplete="current-password" required>
      <p class="auth-err" id="login-err" role="alert"></p>
      <button type="submit" class="auth-btn">Belépés</button>
    </form>

    <form id="boot-form" class="auth-form" hidden>
      <h1>Első beállítás</h1>
      <label for="boot-email">Admin e-mail címe</label>
      <input id="boot-email" name="email" type="email" autocomplete="username" required>
      <label for="boot-password">Jelszó</label>
      <input id="boot-password" name="password" type="password" autocomplete="new-password" minlength="8" required>
      <label for="boot-password2">Jelszó újra</label>
      <input id="boot-password2" name="password2" type="password" autocomplete="new-password" minlength="8" required>
      <p class="auth-err" id="boot-err" role="alert"></p>
      <button type="submit" class="auth-btn">Létrehozás</button>
    </form>

    <div id="denied" class="auth-form" hidden>
      <h1>Nincs hozzáférés</h1>
      <p class="auth-text" id="denied-text"></p>
      <button type="button" class="auth-btn" data-action="logout">Kijelentkezés</button>
    </div>

    <div id="auth-loading" class="auth-loading" hidden><span class="sync-dot busy"></span></div>
  </div>
</section>

<dialog id="settings" class="settings" aria-labelledby="settings-title">
  <div class="settings-inner">
    <div class="settings-head">
      <h2 id="settings-title">Beállítások</h2>
      <button type="button" class="x-btn" data-action="settings-close" aria-label="Bezárás"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
    </div>

    <section class="set-sec">
      <h3>Fiók</h3>
      <div class="me" id="me"></div>
      <form id="pw-form" class="row-form">
        <label class="sr" for="pw-new">Új jelszó</label>
        <input id="pw-new" type="password" autocomplete="new-password" minlength="8" placeholder="Új jelszó" required>
        <button type="submit" class="btn-ghost sm">Jelszó módosítása</button>
      </form>
      <button type="button" class="btn-ghost sm" data-action="logout">Kijelentkezés</button>
    </section>

    <section class="set-sec" id="users-sec" hidden>
      <h3>Felhasználók</h3>
      <ul class="users" id="users"></ul>
      <form id="user-form" class="user-form">
        <label class="sr" for="user-email">E-mail</label>
        <input id="user-email" type="email" placeholder="kolléga@hgllog.com" autocomplete="off" required>
        <label class="sr" for="user-role">Szerepkör</label>
        <select id="user-role">
          <option value="editor">Szerkesztő</option>
          <option value="admin">Admin</option>
        </select>
        <button type="submit" class="btn-primary sm">Hozzáadás</button>
      </form>
      <div class="newpw" id="newpw" hidden></div>
    </section>

    <section class="set-sec" id="outlook-sec" hidden>
      <h3>Outlook-szinkron</h3>
      <form id="outlook-form" class="stack-form">
        <label>Feladó e-mail címe
          <input name="sender" type="email" autocomplete="off" spellcheck="false" required>
        </label>
        <label>Tárgy tartalmazza
          <input name="subject_hint" type="text" autocomplete="off" spellcheck="false">
        </label>
        <label>Frissítés (perc)
          <input name="interval_min" type="number" min="2" max="240" step="1" required>
        </label>
        <label class="check"><input name="autostart" type="checkbox">Indítás a Windows-zal</label>
        <div class="settings-row">
          <button type="submit" class="btn-primary sm">Mentés</button>
          <button type="button" class="btn-ghost sm" data-action="resync">Teljes újraolvasás</button>
          <button type="button" class="btn-ghost sm" data-action="datafolder">Adatmappa</button>
        </div>
      </form>
    </section>
  </div>
</dialog>

<script src="vendor/supabase.min.js"></script>
<script src="config.js"></script>
<script src="derive.js"></script>
<script src="app.js"></script>
</body>
</html>
